<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>TAOSTORE — Китайские каталоги и закупки</title>
<meta name="description" content="TAOSTORE — каталоги товаров из Китая, оптовые закупки и сопровождение до получения груза в РФ. Работаем с 2012 года.">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.page{
  position:relative;
  width:100%;
  max-width:708px;
  margin:0 auto;
  background:#111;
}
.hero-image{
  width:100%;
  height:auto;
  display:block;
}
.hotspot{
  position:absolute;
  display:block;
  border-radius:18px;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Catalogs */
.c1{left:13.5%;top:31.1%;width:34.5%;height:8.2%}
.c2{left:50.0%;top:31.1%;width:34.0%;height:8.2%}
.c3{left:13.5%;top:39.0%;width:34.5%;height:8.2%}
.c4{left:50.0%;top:39.0%;width:34.0%;height:8.2%}

/* Order buttons */
.o1{left:19.0%;top:55.0%;width:53.5%;height:5.1%}
.o2{left:19.0%;top:60.0%;width:53.5%;height:5.1%}
.o3{left:19.0%;top:65.0%;width:53.5%;height:5.1%}

/* Social icons */
.s1{left:21.5%;top:79.7%;width:11%;height:8%}
.s2{left:36.2%;top:79.7%;width:11%;height:8%}
.s3{left:51.0%;top:79.7%;width:11%;height:8%}
.s4{left:65.8%;top:79.7%;width:11%;height:8%}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0
}

@media(min-width:709px){
  body{padding:24px 0}
  .page{border-radius:26px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.45)}
}
</style>
</head>
<body>
<main class="page" aria-label="TAOSTORE">
  <img class="hero-image" src="taostore-bg.jpg" alt="TAOSTORE — каталоги товаров из Китая, работаем с 2012 года">

  <a class="hotspot c1" href="https://t.me/taostoredewu" aria-label="Каталог оригинальной продукции"><span class="sr-only">Оригинальная продукция</span></a>
  <a class="hotspot c2" href="https://t.me/taostoreluxe" aria-label="Каталог женской одежды"><span class="sr-only">Женская одежда</span></a>
  <a class="hotspot c3" href="https://t.me/taostorekms" aria-label="Каталог спортивной обуви"><span class="sr-only">Спортивная обувь</span></a>
  <a class="hotspot c4" href="https://vk.com/taostorekms" aria-label="Товары с маркетов Китая"><span class="sr-only">Товары с маркетов Китая</span></a>

  <a class="hotspot o1" href="https://t.me/ann_shumi" aria-label="Заказать в Telegram"><span class="sr-only">Заказать в Telegram</span></a>
  <a class="hotspot o2" href="https://vk.com/ann_shum" aria-label="Заказать во ВКонтакте"><span class="sr-only">Заказать во ВКонтакте</span></a>
  <a class="hotspot o3" href="https://api.whatsapp.com/send?phone=79990887179" aria-label="Заказать в WhatsApp"><span class="sr-only">Заказать в WhatsApp</span></a>

  <a class="hotspot s1" href="https://vk.com/taostorekms" aria-label="TAOSTORE во ВКонтакте"><span class="sr-only">ВКонтакте</span></a>
  <a class="hotspot s2" href="https://t.me/taostorekms" aria-label="TAOSTORE в Telegram"><span class="sr-only">Telegram</span></a>
  <a class="hotspot s3" href="https://api.whatsapp.com/send?phone=79990887179" aria-label="TAOSTORE в WhatsApp"><span class="sr-only">WhatsApp</span></a>
  <a class="hotspot s4" href="https://www.instagram.com/" aria-label="Instagram"><span class="sr-only">Instagram</span></a>
</main>
</body>
</html>
